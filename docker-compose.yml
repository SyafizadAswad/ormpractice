services:
  postgres:
    image: postgres:16-alpine
    container_name: orm-practice-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: orm_user
      POSTGRES_PASSWORD: orm_password
      POSTGRES_DB: orm_practice
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orm_user -d orm_practice"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
